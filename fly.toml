app = 'plateos-landing-page'
primary_region = 'arn'

[build]
  # Build args are passed via deploy.ps1 script to keep secrets out of version control

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  NODE_ENV = "production"
